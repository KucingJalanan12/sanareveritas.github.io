<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Claim - Sanare Veritas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<!-- NAVBAR -->
<div id="header-placeholder"></div>
<script src="../assets/js/header-loader.js"></script>

<section class="submit-section">

    <h2>Submit a Claim</h2>

    <p>
        Seen a health claim online and not sure whether it's true?
        Send it to SANARE and we may investigate it.
    </p>

    <form
        class="claim-form"
        action="https://formspree.io/f/xaqgeqzg"
        method="POST">

        <label>Health Claim</label>
        <input type="text" name="claim" required>

        <label>Where did you see this claim?</label>
        <input type="text" name="source" required>

        <label>Additional Notes</label>
        <textarea name="notes"></textarea>

        <button type="submit">
            Submit Claim
        </button>

    </form>

</section>

<script src="../assets/js/script.js"></script>

</body>
</html>
